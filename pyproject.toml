[project]
name = "citesage"
version = "0.1.0"
description = "Citation-grounded research assistant with verifiable inline citations"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "pymupdf>=1.24.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
citesage = "citesage.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100