[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citesage"
version = "0.1.0"
description = "Citation-grounded research assistant with verifiable page-level citations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "pymupdf>=1.24",
    "arxiv>=2.1",
    "httpx>=0.27",
    "python-dotenv>=1.2",
    "sentence-transformers>=3.0",
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
citesage = "citesage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]